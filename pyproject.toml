[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-browser-qa-agent"
version = "0.1.0"
description = "A safety-first autonomous browser QA agent powered by Playwright and FastAPI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ThinkNovus Technologies" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "playwright>=1.57,<2.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
openai = ["openai>=2.0,<3.0"]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<10.0",
  "pytest-asyncio>=0.24,<2.0",
  "ruff>=0.9,<1.0",
]

[project.scripts]
browser-qa = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
